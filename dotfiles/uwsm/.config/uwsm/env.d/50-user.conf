# Personal session environment, picked up by uwsm (quattro reads env.d/).
# Changes require a session restart to take effect.

export TERMINAL=xdg-terminal-exec

# Use emacs (emacsclient with fallback to emacs)
export EDITOR=emacs

# GnuPG as SSH agent
export SSH_AUTH_SOCK="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/gnupg/S.gpg-agent.ssh"
