general {
    lock_cmd = omarchy-system-lock                         # lock screen and 1password
    before_sleep_cmd = OMARCHY_LOCK_ONLY=true omarchy-system-lock    # lock before suspend without scheduling display off.
    after_sleep_cmd = sleep 1 && omarchy-system-wake                    # delay for PAM readiness, then turn on display.
    inhibit_sleep = 3                                      # wait until screen is locked
}

# 1. Turn off keyboard backlight (14 min)
listener {
    timeout = 840
    on-timeout = brightnessctl -sd '*::kbd_backlight' set 0
    on-resume = brightnessctl -rd '*::kbd_backlight'
}

# 2. Start screensaver (15 min)
listener {
    timeout = 900
    on-timeout = pidof hyprlock || omarchy-launch-screensaver
}

# 3. Lock screen (16 min)
listener {
    timeout = 960
    on-timeout = omarchy-system-lock
}

# 4. Turn off display (16.5 min, after lock has engaged)
listener {
    timeout = 990
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on && brightnessctl -r
}
